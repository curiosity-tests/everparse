name: Upgrade hashes, 3D doc, CBOR, COSE snapshots
on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a pull request (if unchecked, push directly to branch)'
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  advance-hashes:
    runs-on: Ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
        ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
    - name: Record base ref
      run: |
        echo "base_branch=${{ github.event_name == 'schedule' && 'master' || github.ref_name }}" > base_ref.txt
        echo "base_sha=$(git rev-parse HEAD)" >> base_ref.txt
    - name: Set up git
      run: |
        git config --global user.name "Dzomo, the Everest Yak"
        git config --global user.email "24394600+dzomo@users.noreply.github.com"
    - name: Install opam
      run: |
        sudo apt-get update && sudo apt-get install --yes --no-install-recommends opam
    - name: Advance hashes
      run: |
        make -C opt -j$(nproc) advance &&
        if ! git diff --exit-code -- opt/hashes.Makefile ; then git add -u opt/hashes.Makefile && git commit -m 'Update hashes' ; fi &&
        git diff --exit-code
    - name: Generate CBOR .krml files
      run: |
        make ADMIT=1 cbor-extract-krml -kj$(nproc)
    - name: Generate CBOR snapshot with Karamel
      run: |
        make ADMIT=1 cbor-snapshot -Otarget -kj$(nproc) && make ADMIT=1 cbor -kj$(nproc)
    - name: Generate COSE .krml files
      run: |
        make ADMIT=1 cose-extract-krml -kj$(nproc)
    - name: Generate COSE snapshot with Karamel
      run: |
        make ADMIT=1 cose-snapshot -Otarget -kj$(nproc) && make ADMIT=1 cose -kj$(nproc)
    - name: Generate 3D doc snapshot
      run: |
        make ADMIT=1 3d-doc-snapshot -kj$(nproc)
    - name: Stage in new snapshots
      run: |
        git add doc/3d-snapshot src/cbor/pulse/det/c src/cbor/pulse/nondet/c src/cbor/pulse/det/rust src/cbor/pulse/nondet/rust src/cose/c src/cose/rust &&
        if ! git diff --staged --exit-code ; then git commit -m "3D doc, CBOR, COSE snapshot" ; fi &&
        git diff --exit-code
    - name: Push new branch
      run: |
        git checkout -b _dzomo_upgrade_${{ github.run_id }} &&
        git push origin _dzomo_upgrade_${{ github.run_id }} &&
        git rev-parse HEAD > hash.txt
    - name: Upload hash
      uses: actions/upload-artifact@v4
      with:
        path: |
          hash.txt
          base_ref.txt
        name: hash

  build-linux:
    runs-on: Ubuntu-22.04
    needs: advance-hashes
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Read hash
      run: |
        hash="$(cat hash.txt)"
        echo "hash=$hash" >> $GITHUB_ENV
    - uses: actions/checkout@master
      with:
        submodules: true
        ref: ${{ env.hash }}
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.2
    - name: Build package
      run: |
        eval $(opam env)
        env OPAMNODEPEXTS=0 make -f package.Makefile package -kj$(nproc)
    - uses: actions/upload-artifact@v4
      with:
        path: |
          everparse_*.tar.gz
        name: everparse-build-linux

  test-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: everparse-build-linux
        path: test0
    - name: Extract artifact
      run: |
        pushd test0
        tar xzf everparse_*.tar.gz
        popd
        mv test0/everparse test
    - name: Check out repo
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          src/3d/tests
          src/cddl/tests/demo/test.cddl
        path: ${{ github.workspace }}/everparse
    - name: Test EverParse
      run: |
        bash ${{ github.workspace }}/test/everparse.sh ${{ github.workspace }}/everparse/src/3d/tests/Arithmetic.3d ${{ github.workspace }}/everparse/src/3d/tests/FieldDependence0.3d && cd ${{ github.workspace }}/everparse/src/3d/tests/ && bash ${{ github.workspace }}/test/everparse.sh Comments.3d && bash ${{ github.workspace }}/test/everparse.sh --check_hashes inplace Comments.3d
    - name: Test EverParse test case generation
      run: |
        bash ${{ github.workspace }}/test/everparse.sh ${{ github.workspace }}/everparse/src/3d/tests/ELFTestGen.3d --odir ${{ github.workspace }}/test-elf --z3_test ELFTestGen._ELFTestGen --z3_witnesses 10 --z3_branch_depth 5
    - name: Test EverCDDL
      run: |
        ${{ github.workspace }}/test/bin/cddl.exe ${{ github.workspace }}/everparse/src/cddl/tests/demo/test.cddl
    - name: Upload test artifact
      uses: actions/upload-artifact@v4
      with:
        path: everparse/src/3d/tests/Comments*
        name: everparse-test-linux

  fstar-src:
    ## NOTE: This is copied from build-src in the F* repo.
    needs: advance-hashes
    runs-on: ubuntu-22.04
    # We prefer slightly older Ubuntu so we get binaries that work on
    # all more recent versions.
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Read hash
      run: |
        hash="$(cat hash.txt)"
        echo "hash=$hash" >> $GITHUB_ENV
    - uses: actions/checkout@master
      with:
        path: everparse
        ref: ${{ env.hash }}
        sparse-checkout: |
          opt/Makefile
          opt/hashes.Makefile
    - name: Get F* hash
      run: |
        echo "fstar_hash=$(make -s -C everparse/opt echo-FStar-hash)" >> $GITHUB_ENV
    - uses: actions/checkout@master
      id: checkout
      with:
        repository: FStarLang/FStar
        ref: ${{ env.fstar_hash }}
    - name: Check cache
      id: check-cache
      uses: actions/cache/restore@v4
      with:
        path: fstar-src.tar.gz
        key: FStar-src-${{steps.checkout.outputs.commit}}
    - uses: ocaml/setup-ocaml@v3
      if: steps.check-cache.outputs.cache-hit != 'true'
      with:
        ocaml-compiler: 4.14.2
    - name: Prepare
      if: steps.check-cache.outputs.cache-hit != 'true'
      run: |
        ./.scripts/get_fstar_z3.sh $HOME/bin
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV
        opam install --deps-only ./fstar.opam
    - name: Set F* version
      if: steps.check-cache.outputs.cache-hit != 'true'
      run: |
        echo FSTAR_VERSION="$(git describe --tags --dirty)" >> $GITHUB_ENV
    - name: Build package
      if: steps.check-cache.outputs.cache-hit != 'true'
      run: |
        eval $(opam env)
        export FSTAR_TAG=
        # ^ no tag in source package
        make -skj$(nproc) package-src ADMIT=1
    - name: Save
      if: steps.check-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: fstar-src.tar.gz
        key: FStar-src-${{steps.checkout.outputs.commit}}
    - uses: actions/upload-artifact@v4
      with:
        path: fstar-src.tar.gz
        name: fstar-src

  ci-linux:
    needs: advance-hashes
    runs-on: ubuntu-latest
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Read hash
      run: |
        hash="$(cat hash.txt)"
        echo "hash=$hash" >> $GITHUB_ENV
    - uses: actions/checkout@master
      with:
        submodules: true
        ref: ${{ env.hash }}
        path: everparse
    - name: Set-up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 5
    - name: Set-up .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: everparse/src/3d/hashchk/global.json
    - name: Everparse CI
      run: |
        make -C everparse -j$(nproc) -k test

  ci-docker:
    needs: advance-hashes
    runs-on: ubuntu-latest
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Read hash
      run: |
        hash="$(cat hash.txt)"
        echo "hash=$hash" >> $GITHUB_ENV
    - uses: actions/checkout@master
      with:
        submodules: true
        ref: ${{ env.hash }}
        path: everparse
    - name: Havoc .depend
      run: |
        echo '$(error "This file should have been cleaned away")' > everparse/.depend
    - name: Get number of processors
      run: |
        echo CI_THREADS=$(nproc) >> $GITHUB_ENV
    - name: Build a Docker image
      uses: docker/build-push-action@v6
      with:
        build-args: |
          CI_THREADS=${{ env.CI_THREADS }}
        context: everparse

  test-interop-linux:
    needs:
    - build-linux
    runs-on: ubuntu-22.04
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: everparse-build-linux
        path: test0
    - name: Extract artifact
      run: |
        pushd test0
        tar xzf everparse_*.tar.gz
        popd
        mv test0/everparse test
    - name: Download Macos test
      uses: actions/download-artifact@v4
      with:
        name: everparse-test-macos
        path: macos
    - name: Test EverParse
      run: |
        cd ${{ github.workspace }}/macos/ && bash ${{ github.workspace }}/test/everparse.sh --check_hashes inplace Comments.3d
    - name: Download Windows test
      uses: actions/download-artifact@v4
      with:
        name: everparse-test-windows
        path: windows
    - name: Test EverParse
      run: |
        cd ${{ github.workspace }}/windows/ && bash ${{ github.workspace }}/test/everparse.sh --check_hashes inplace Comments.3d

  create-pr:
    needs:
    - test-interop-linux
    - ci-linux
    - ci-docker
    runs-on: ubuntu-latest
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Record hash and remove hash file
      run: |
        echo "updated_sha=$(cat hash.txt)" >> $GITHUB_ENV && rm hash.txt
        source base_ref.txt
        echo "base_branch=$base_branch" >> $GITHUB_ENV
        echo "base_sha=$base_sha" >> $GITHUB_ENV
        rm base_ref.txt
    - uses: actions/checkout@master
      with:
        submodules: true
        fetch-depth: 0
        ref: ${{ env.updated_sha }}
    - name: create pull request
      if: (github.event_name == 'schedule' && env.base_branch == 'master') || (github.event_name == 'workflow_dispatch' && inputs.create_pr)
      run: |
        if [[ "$updated_sha" != "$base_sha" ]] ; then git checkout -b _dzomo_pr_${{ github.run_id }} && git push --set-upstream origin _dzomo_pr_${{ github.run_id }} && gh pr create --base "$base_branch" --title "Update hashes and snapshots" --fill-verbose ; fi
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Push to branch directly
      if: (github.event_name == 'schedule' && env.base_branch != 'master') || (github.event_name == 'workflow_dispatch' && !inputs.create_pr)
      run: |
        if [[ "$updated_sha" != "$base_sha" ]] ; then git push origin HEAD:"$base_branch" ; fi
    - name: Delete branch
      run: |
        if [[ "$(git rev-parse origin/_dzomo_upgrade_${{ github.run_id }})" = "$updated_sha" ]] ; then git push origin --delete _dzomo_upgrade_${{ github.run_id }} ; fi

  deps:
    runs-on: ubuntu-latest
    needs: create-pr
    steps:
    - name: Download hash
      uses: actions/download-artifact@v4
      with:
        name: hash
    - name: Record hash and remove hash file
      run: |
        echo "updated_sha=$(cat hash.txt)" >> $GITHUB_ENV && rm hash.txt
    - uses: actions/checkout@master
      with:
        submodules: true
        ref: ${{ env.updated_sha }}
        sparse-checkout: |
          Dockerfile
          deps.Makefile
          opt/Makefile
          opt/hashes.Makefile
          src/package/start-code-server.sh
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: deps.tgz
        key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile') }}
        lookup-only: true
        fail-on-cache-miss: false
    - name: Build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        rm -rf .git && docker build -t dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile') }} --pull --target deps .
    - name: Save image
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        docker save dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile') }} | gzip > deps.tgz
    - name: Upload image into cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          deps.tgz
        key: dzomoeverparsedeps${{ hashFiles('opt/hashes.Makefile', 'Dockerfile') }}
